<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Paired VLA adapter evaluation</title>
  <desc id="desc">The same held-out inputs, base model, seeds and sampling profile feed a frozen base arm and a base plus adapter arm, followed by paired scoring and a disclosure gate.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <text x="70" y="82" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#101828">Paired VLA adapter evidence</text>
  <text x="70" y="122" font-family="Inter,Arial,sans-serif" font-size="20" fill="#475467">Change one thing. Pair every observation. Publish only what the data license allows.</text>

  <rect x="70" y="190" width="245" height="180" rx="18" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/>
  <text x="192" y="235" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#101828">Frozen inputs</text>
  <text x="192" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475467">same held-out units</text>
  <text x="192" y="310" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475467">same order + seeds</text>
  <text x="192" y="342" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475467">same sampling</text>

  <path d="M315 245 H390" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M315 325 H390" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="405" y="175" width="265" height="105" rx="18" fill="#ffffff" stroke="#98a2b3" stroke-width="2"/>
  <text x="538" y="218" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#101828">Arm A</text>
  <text x="538" y="250" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475467">frozen base</text>

  <rect x="405" y="300" width="265" height="105" rx="18" fill="#eef7ff" stroke="#1570ef" stroke-width="2"/>
  <text x="538" y="343" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#175cd3">Arm B</text>
  <text x="538" y="375" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#475467">same base + adapter</text>

  <path d="M670 228 H750" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 352 H750" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="765" y="190" width="180" height="180" rx="18" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/>
  <text x="855" y="238" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#101828">Paired score</text>
  <text x="855" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475467">per-unit delta</text>
  <text x="855" y="314" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475467">95% interval</text>
  <text x="855" y="346" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#475467">judge-free check</text>

  <path d="M945 280 H1000" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1015" y="215" width="125" height="130" rx="18" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
  <text x="1078" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#027a48">License</text>
  <text x="1078" y="291" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#027a48">gate</text>
  <text x="1078" y="320" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475467">before publish</text>

  <rect x="70" y="455" width="1070" height="92" rx="16" fill="#101828"/>
  <text x="600" y="495" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">A weight claim requires the same system on both sides.</text>
  <text x="600" y="526" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#d0d5dd">If prompts, tools, context or selection also change, call it a system delta.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#667085"/>
    </marker>
  </defs>
</svg>
